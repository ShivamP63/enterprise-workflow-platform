server:
  port: 8080
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/workflow_local}
    username: ${SPRING_DATASOURCE_USERNAME:workflow_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    validate-on-migrate: true
app:
  jwt:
    secret: ${APP_JWT_SECRET:local-development-secret-change-this-value-123456789}
    expiration: ${APP_JWT_EXPIRATION:PT2H}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

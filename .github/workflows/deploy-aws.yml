name: Deploy backend to AWS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-aws.yml'
permissions:
  contents: read
env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/portfolio/workflow-api:${{ github.sha }}
      - name: Inspect EC2 and SSM deployment targets
        run: |
          echo "Running EC2 instances:"
          aws ec2 describe-instances \
            --filters Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].{Id:InstanceId,Name:Tags[?Key==`Name`].Value|[0],PrivateIp:PrivateIpAddress}' \
            --output table
          echo "SSM-managed instances:"
          aws ssm describe-instance-information \
            --query 'InstanceInformationList[].{Id:InstanceId,Ping:PingStatus,Platform:PlatformName}' \
            --output table
      - name: Restart backend through SSM
        run: |
          DEPLOY_SCRIPT_B64=$(base64 -w0 deploy/deploy.sh)
          COMMANDS=$(jq -nc --arg script "$DEPLOY_SCRIPT_B64" --arg tag "${{ github.sha }}" \
            '[ ("echo " + $script + " | base64 -d > /opt/portfolio/deploy.sh"), "chmod +x /opt/portfolio/deploy.sh", ("AWS_REGION=us-east-2 AWS_ACCOUNT_ID=${{ env.AWS_ACCOUNT_ID }} /opt/portfolio/deploy.sh " + $tag) ]')
          COMMAND_ID=$(aws ssm send-command \
            --targets Key=tag:Name,Values=portfolio-shared-host \
            --document-name AWS-RunShellScript \
            --parameters "$COMMANDS" \
            --comment "Deploy workflow API ${{ github.sha }}" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command: ${COMMAND_ID}"
          INSTANCE_ID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=portfolio-shared-host Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then echo "No running EC2 target found"; exit 1; fi
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || true)
            echo "SSM status: ${STATUS}"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut) aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json; exit 1 ;;
            esac
            sleep 10
          done
          echo "SSM command did not finish within the polling window."
          exit 1
